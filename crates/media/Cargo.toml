[package]
name = "screengrabcraft-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ScreenGrabCraft's video: the recording file, the timeline and its edits, and making MP4 videos (AV1 and Opus)"

[lints]
workspace = true

[dependencies]
screengrabcraft-model = { workspace = true }
screengrabcraft-render = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
lz4_flex = { workspace = true }
crc32fast = { workspace = true }

# The encoders: Rust all the way down, royalty-free. Not in the browser build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rav1e = { workspace = true }
rusty-opus = { workspace = true }
symphonia = { workspace = true }

# H.264 and AAC by Windows' own encoders (its media transcoder), for videos every player opens.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation", "Media_Core", "Media_MediaProperties", "Media_Transcoding", "Security_Cryptography", "Storage", "Storage_FileProperties", "Storage_Streams"] }

[dev-dependencies]
proptest = { workspace = true }
