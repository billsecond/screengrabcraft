# Flatpak manifest for the single-file bundle attached to every GitHub release
# (screengrabcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (screengrabcraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# One Flatpak holds the three programs: the capture service is the command; the editor's desktop
# entry and icons are exported too (their names start with the app id). Starting at sign-in goes
# through the Background portal, so the tarball's autostart entry and systemd unit stay out.
#
# io.github.billsecond.screengrabcraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.billsecond.screengrabcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: screengrabcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the renderer.
  - --device=dri
  # Captures are saved in Pictures/ScreenGrabCraft. Documents is granted so pictures and
  # projects passed by path (the command line, Open Recent, "Save" next to the original) work in
  # the usual places; Open/Save dialogs go through the file-chooser portal.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # The tray icon (D-Bus StatusNotifierItem): talk to the desktop's StatusNotifierWatcher.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Deliberately not granted: network, home/host filesystem access. On Wayland, screenshots and
  # the global capture shortcuts go through the desktop's portals, which need no permission here.
modules:
  - name: screengrabcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/screengrabcraft /app/bin/screengrabcraft
      - install -Dm755 bin/screengrabcraft-editor /app/bin/screengrabcraft-editor
      - install -Dm755 bin/screengrabcraft-cli /app/bin/screengrabcraft-cli
      - install -Dm644 share/applications/io.github.billsecond.screengrabcraft.desktop /app/share/applications/io.github.billsecond.screengrabcraft.desktop
      - install -Dm644 share/applications/io.github.billsecond.screengrabcraft.editor.desktop /app/share/applications/io.github.billsecond.screengrabcraft.editor.desktop
      - install -Dm644 share/mime/packages/io.github.billsecond.screengrabcraft.xml /app/share/mime/packages/io.github.billsecond.screengrabcraft.xml
      # Already has the release's version and date substituted by package.sh. The Flatpak is one
      # app (the capture service's id), so only its metainfo goes in.
      - install -Dm644 share/metainfo/io.github.billsecond.screengrabcraft.metainfo.xml /app/share/metainfo/io.github.billsecond.screengrabcraft.metainfo.xml
      # Docs include the licences of the embedded fonts (OFL-*.txt).
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/screengrabcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
