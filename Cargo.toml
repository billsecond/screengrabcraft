[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/screengrabcraft", "apps/screengrabcraft-editor", "apps/screengrabcraft-cli", "xtask"]

[workspace.package]
version = "0.1.42"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/billsecond/screengrabcraft"

[workspace.dependencies]
# internal
screengrabcraft-model = { path = "crates/model" }
screengrabcraft-render = { path = "crates/render" }
screengrabcraft-media = { path = "crates/media" }
screengrabcraft-capture = { path = "crates/capture" }
screengrabcraft-matte = { path = "crates/matte" }
screengrabcraft-speech = { path = "crates/speech" }
screengrabcraft-engine = { path = "crates/engine" }
screengrabcraft-ui = { path = "crates/ui" }
screengrabcraft-desktop = { path = "crates/desktop" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
base64 = "0.22"
getrandom = "0.3"

# Pictures: decoding what is opened or pasted, encoding what is saved. Rust all the way down.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
gif = "0.14"
# Drawing the annotations onto the picture (paths, strokes, gradients, anti-aliasing): a
# port of a subset of Skia, Rust only, the browser build included.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Glyph outlines from the bundled fonts, for text the annotations carry.
ab_glyph = "0.2.32"
# Deflate for the PDF writer (the backend written in Rust).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Video: the recording file's frames (LZ4, Rust only) and its checksums, then the encoders that
# make the MP4: AV1 (rav1e) and Opus (rusty-opus), both royalty-free and written in Rust.
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
crc32fast = "1.4"
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
rusty-opus = "1.0.2"
# Sound files brought into the video editor (MP3, AAC and M4A, WAV, FLAC, Ogg): decoded in Rust.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis", "adpcm"] }
# Windows' own H.264 and AAC encoders, through its media transcoder (safe Windows Runtime calls).
windows = { version = "0.62", default-features = false }

# Speech to text after a recording (Whisper, on the processor): the tensor library written in
# Rust, its FFT, and casts for aligned copies. Not in the browser build.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
rustfft = "6.4.1"
bytemuck = "1.25"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

# desktop only
rfd = "0.17"
pollster = "0.4"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
global-hotkey = "0.8.0"
dirs = "7"
webbrowser = "1.2"
# The update check, the one thing that goes to the network: HTTPS to GitHub's releases. Rust all
# the way (rustls with ring, Mozilla's roots bundled), no cookies, no compression.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
semver = "1"
ring = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
