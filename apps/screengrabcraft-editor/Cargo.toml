[package]
name = "screengrabcraft-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ScreenGrabCraft Editor: annotate, mark up and share screenshots"

[lints]
workspace = true

[dependencies]
screengrabcraft-model = { workspace = true }
screengrabcraft-render = { workspace = true }
screengrabcraft-media = { workspace = true }
screengrabcraft-ui = { workspace = true }
screengrabcraft-desktop = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
# Deleting a capture from the strip moves it to the Recycle Bin (the Trash), never for good.
trash = "5.2"
# Playing a video recording's sound while editing it.
cpal = "0.18.2"

[build-dependencies]
# Icon + VERSIONINFO for the .exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
