[package]
name = "screengrabcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "screengrabcraft"
description = "ScreenGrabCraft: the screen capture service in the tray"

[lints]
workspace = true

[dependencies]
screengrabcraft-model = { workspace = true }
screengrabcraft-render = { workspace = true }
screengrabcraft-capture = { workspace = true }
screengrabcraft-ui = { workspace = true }
screengrabcraft-desktop = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for the .exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The event loop's activation policy (Accessory: a menu-bar program, no Dock icon); the same winit
# eframe runs on.
winit = { version = "0.30", default-features = false }
